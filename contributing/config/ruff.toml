# Only needed if the repository has no pyproject.toml with requires-python.
# target-version = "py310"

[lint]
extend-select = [
    "I002",  # Require the imports below.
    "N",     # Enforce pep8-naming.
    "UP006", # Enforce `list[str]` instead of `List[str]`.
    "UP007", # Enforce `X | Y` instead of `Union[X, Y]`.
    "UP045", # Enforce `X | None` instead of `Optional[X]`.
]

[lint.isort]
required-imports = ["from __future__ import annotations"]
